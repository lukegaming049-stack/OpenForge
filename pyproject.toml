[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openforge"
version = "0.1.0"
description = "BYOK coding agent harness: native tool calling, local GGUF models, built-in editor TUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenForge contributors" }]
keywords = ["ai", "coding-agent", "byok", "gguf", "llama.cpp", "tui", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "textual>=0.60",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
openforge = "openforge.cli:main"
forge = "openforge.cli:main"

[tool.setuptools.packages.find]
include = ["openforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
